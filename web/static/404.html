<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — LNKR</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(#2a2a2a 1px, transparent 1px),
        linear-gradient(90deg, #2a2a2a 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .code {
      font-family: 'Syne', sans-serif;
      font-size: clamp(100px, 20vw, 180px);
      font-weight: 800;
      line-height: 1;
      color: #00ff88;
      letter-spacing: -0.04em;
      opacity: 0.15;
      user-select: none;
    }

    .title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-top: -20px;
      margin-bottom: 12px;
    }

    .sub {
      color: #555;
      font-size: 12px;
      letter-spacing: 0.08em;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      background: #00ff88;
      color: #000;
      text-decoration: none;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 14px 32px;
      border-radius: 4px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      background: #33ffaa;
      box-shadow: 0 0 24px rgba(0,255,136,0.35);
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="content">
    <div class="code">404</div>
    <h1 class="title">LINK NOT FOUND</h1>
    <p class="sub">Ссылка удалена или никогда не существовала</p>
    <a href="/" class="btn">← ВЕРНУТЬСЯ</a>
  </div>
</body>
</html>
