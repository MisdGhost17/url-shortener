<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LNKR — Сокращатель ссылок</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="grid-bg"></div>

  <div class="app">

    <header class="header">
      <div class="logo">
        <span class="logo-bracket">[</span>
        <span class="logo-text">LNKR</span>
        <span class="logo-bracket">]</span>
      </div>
      <div class="header-meta">
        <span class="status-dot"></span>
        <span class="status-text">АПИ РАБОТАЕТ</span>
        <span class="divider">|</span>
        <span id="linkCount">0 ССЫЛОК</span>
      </div>
    </header>

    <section class="hero">
      <h1 class="hero-title">SHORTEN<br><em>ANY URL</em></h1>
      <p class="hero-sub">Вставь ссылку. Получи короткую. Всё.</p>

      <div class="input-row">
        <div class="input-wrap">
          <span class="input-prefix">https://</span>
          <input
            id="urlInput"
            type="text"
            placeholder="очень-длинный-домен.com/путь/к/чему-то/глубокому"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <button id="shortenBtn" class="btn-primary">
          <span class="btn-label">СОКРАТИТЬ</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>

      <div id="resultCard" class="result-card hidden">
        <div class="result-header">
          <span class="result-label">// ССЫЛКА СОЗДАНА</span>
          <button id="closeResult" class="close-btn">✕</button>
        </div>
        <div class="result-body">
          <a id="resultLink" href="#" target="_blank" class="result-url"></a>
          <button id="copyBtn" class="btn-copy">
            <span id="copyLabel">КОПИРОВАТЬ</span>
          </button>
        </div>
        <div class="result-original">
          <span class="dim">ОРИГИНАЛ →</span>
          <span id="resultOriginal" class="result-orig-text"></span>
        </div>
      </div>

      <div id="errorToast" class="error-toast hidden">
        <span class="error-icon">!</span>
        <span id="errorMsg"></span>
      </div>
    </section>

    <section class="links-section">
      <div class="section-header">
        <h2 class="section-title">// ВСЕ ССЫЛКИ</h2>
        <button id="refreshBtn" class="btn-ghost">↻ ОБНОВИТЬ</button>
      </div>

      <div id="tableWrap" class="table-wrap">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">∅</div>
          <p>Ссылок пока нет. Сократи что-нибудь выше.</p>
        </div>
        <table id="linksTable" class="links-table hidden">
          <thead>
            <tr>
              <th>КОД</th>
              <th>ОРИГИНАЛЬНЫЙ URL</th>
              <th>СОЗДАНО</th>
              <th>ПЕРЕХОДЫ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="linksBody"></tbody>
        </table>
      </div>
    </section>

  </div>

  <div id="copiedTooltip" class="copied-tooltip hidden">СКОПИРОВАНО!</div>

  <script src="/static/js/app.js"></script>
</body>
</html>
